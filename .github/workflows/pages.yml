name: Build static site

# 把 static/ 发布到 GitHub Pages。
# 触发条件：events.py（数据）、build_static.py（生成脚本）、static/（模板与产物）有改动时自动重新生成再发布。
# 所以就算你在网页上直接改 events.py，站点也会自动更新，不用本地跑脚本。

on:
  push:
    branches: [main]
    paths:
      - 'events.py'
      - 'build_static.py'
      - 'static/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 重新生成 static/index.html 与 static/ics/*.ics
        run: python build_static.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
